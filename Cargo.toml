[package]
name = "wxman"
version = "0.1.3"
edition = "2021"
description = "A terminal-based weather application"
authors = ["wxman"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
dirs = "5"
toml = "0.8"
anyhow = "1"
